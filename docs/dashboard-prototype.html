*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Shell ── */
.shell{max-width:520px;margin:0 auto;padding:0 16px}

/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--rule);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}

/* ── Tabs ── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--rule);display:flex;padding:6px 0 env(safe-area-inset-bottom,8px)}

/* ── Page visibility ── */
.page{display:none}
.page.active{display:block}

/* ── Shared card ── */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}

.kpi-note{font-size:10px;font-weight:600;margin-top:1px}

.modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 20px env(safe-area-inset-bottom,20px);width:100%;max-width:520px;transform:translateY(100%);transition:transform .25s cubic-bezier(.16,1,.3,1)}

.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--rule-strong);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);padding:8px 10px;font-size:11px;z-index:80;opacity:0;transition:opacity .12s;max-width:190px}

// ── Helpers ──
const gc=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt=n=>n.toLocaleString('ko-KR');
const fmtA=n=>n>=10000?fmt(Math.round(n/10000))+'만원':fmt(n)+'원';
const dc=d=>d>0?'--up':d<0?'--down':'--ink-3';
const ds=d=>(d>0?'+':'')+d.toFixed(1)+'%';
const da=d=>d>0.3?'▲':d<-0.3?'▼':'→';

function renderRank(){
  const el=document.getElementById('amRank');
  const mx=Math.max(...AM.map(a=>a.v));
  el.innerHTML=AM.map(a=>{
    const pct=(a.v/mx*100).toFixed(1);
    const col=gc(a.c);
    return`<div class="am-row">
      <div class="am-name"><span class="am-dot" style="background:${col}"></span>${a.n}</div>
      <div class="am-track"><div class="am-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="am-metrics">
        <div class="am-val">${fmt(a.v)}원</div>
        <div class="am-delta" style="color:var(${dc(a.d)})">${da(a.d)} ${ds(a.d)}</div>
      </div>
    </div>`;
  }).join('');
}

function spark(id,data,color,fill){
  const c=document.getElementById(id);if(!c)return;
  const dpr=devicePixelRatio||1,r=c.getBoundingClientRect();
  c.width=r.width*dpr;c.height=r.height*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const w=r.width,h=r.height,p=4;
  const mn=Math.min(...data)*.97,mx=Math.max(...data)*1.03,rg=mx-mn||1;
  const pts=data.map((v,i)=>({x:p+i/(data.length-1)*(w-p*2),y:p+(1-(v-mn)/rg)*(h-p*2)}));
  if(fill){
    x.beginPath();x.moveTo(pts[0].x,h);pts.forEach(pt=>x.lineTo(pt.x,pt.y));x.lineTo(pts[pts.length-1].x,h);x.closePath();
    const rr=parseInt(color.slice(1,3),16),gg=parseInt(color.slice(3,5),16),bb=parseInt(color.slice(5,7),16);
    x.fillStyle=`rgba(${rr},${gg},${bb},${fill})`;x.fill();
  }
  x.beginPath();pts.forEach((pt,i)=>i?x.lineTo(pt.x,pt.y):x.moveTo(pt.x,pt.y));
  x.strokeStyle=color;x.lineWidth=2;x.lineJoin='round';x.lineCap='round';x.stroke();
  const L=pts[pts.length-1],sf=gc('--surface');
  x.beginPath();x.arc(L.x,L.y,4.5,0,Math.PI*2);x.fillStyle=sf;x.fill();
  x.beginPath();x.arc(L.x,L.y,3,0,Math.PI*2);x.fillStyle=color;x.fill();
}

function drawTrend(){
  const c=document.getElementById('trendChart');if(!c)return;
  const dpr=devicePixelRatio||1,rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;c.height=200*dpr;c.style.height='200px';
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const w=rect.width,h=200,pL=44,pR=12,pT=8,pB=24;
  const pw=w-pL-pR,ph=h-pT-pB;
  const all=AM.flatMap(a=>a.w);
  const yMn=Math.floor(Math.min(...all)/5000)*5000;
  const yMx=Math.ceil(Math.max(...all)/5000)*5000;
  const yr=yMx-yMn||1;const xs=pw/(DAYS.length-1);
  const tX=i=>pL+i*xs,tY=v=>pT+(1-(v-yMn)/yr)*ph;
  const grid=gc('--rule'),muted=gc('--ink-3');
  x.textAlign='right';x.textBaseline='middle';x.font='10px system-ui,sans-serif';
  for(let i=0;i<=4;i++){
    const v=yMn+yr/4*i,y=tY(v);
    x.strokeStyle=grid;x.lineWidth=1;x.beginPath();x.moveTo(pL,y);x.lineTo(w-pR,y);x.stroke();
    x.fillStyle=muted;x.fillText(fmt(Math.round(v/1000))+'K',pL-5,y);
  }
  x.strokeStyle=gc('--rule-strong');x.lineWidth=1;x.beginPath();x.moveTo(pL,pT+ph);x.lineTo(w-pR,pT+ph);x.stroke();
  x.textAlign='center';x.textBaseline='top';
  DAYS.forEach((d,i)=>{x.fillStyle=muted;x.fillText(d,tX(i),pT+ph+6)});
  const cpts=[];
  AM.forEach(a=>{
    const col=gc(a.c);const pts=a.w.map((v,i)=>({x:tX(i),y:tY(v),v}));
    cpts.push({n:a.n,col,pts});
    x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));
    x.strokeStyle=col;x.lineWidth=2;x.lineJoin='round';x.lineCap='round';x.stroke();
    const L=pts[pts.length-1],sf=gc('--surface');
    x.beginPath();x.arc(L.x,L.y,3.5,0,Math.PI*2);x.fillStyle=sf;x.fill();
    x.beginPath();x.arc(L.x,L.y,2.2,0,Math.PI*2);x.fillStyle=col;x.fill();
  });
  // Legend
  document.getElementById('trendLegend').innerHTML=AM.map(a=>`<div class="legend-item"><span class="legend-line" style="background:${gc(a.c)}"></span>${a.n}</div>`).join('');
  // Tooltip
  const tip=document.getElementById('tip'),tipD=document.getElementById('tipD'),tipR=document.getElementById('tipR');
  c.onpointermove=e=>{
    const cr=c.getBoundingClientRect(),mx=e.clientX-cr.left;
    let ni=0,nd=Infinity;DAYS.forEach((_,i)=>{const d=Math.abs(mx-tX(i));if(d<nd){nd=d;ni=i}});
    if(nd>xs*.6){tip.classList.remove('show');return}
    tipD.textContent='2026.'+DAYS[ni];
    tipR.innerHTML=cpts.map(cp=>`<div class="tip-row"><span class="tip-dot" style="background:${cp.col}"></span><span class="tip-name">${cp.n}</span><span class="tip-val">${fmt(cp.pts[ni].v)}</span></div>`).join('');
    tip.classList.add('show');
    let tx=e.clientX+12,ty=e.clientY-10;
    if(tx+190>innerWidth)tx=e.clientX-200;
    if(ty+160>innerHeight)ty=e.clientY-160;
    tip.style.left=tx+'px';tip.style.top=ty+'px';
  };
  c.onpointerleave=()=>tip.classList.remove('show');
}

function redrawCharts(){
  const acc=gc('--accent');

  drawTrend();
}

function signDoc(id){
  const doc=DOCS.find(d=>d.id===id);
  const area=document.getElementById('signArea-'+id);

  area.innerHTML=`<div class="sign-done">
    <div class="sign-done-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <span class="sign-done-text">서명 완료</span>
    <span class="sign-done-time">08:${String(Math.floor(Math.random()*50+10)).padStart(2,'0')}</span>
  </div>`;
  card.classList.add('signed');
  updateSignCount(-1);
  ga('approval_sign',{doc_title:doc?doc.title:'',doc_type:doc?doc.type:'',amount:doc?doc.amount:0});
}

function rejectDoc(id){
  pendingReject=id;
  document.getElementById('rejectModal').classList.add('open');
  document.getElementById('rejectReason').focus();
}
function closeReject(){
  document.getElementById('rejectModal').classList.remove('open');
  document.getElementById('rejectReason').value='';
  pendingReject=null;
}
function confirmReject(){
  if(pendingReject===null)return;
  const id=pendingReject;
  const area=document.getElementById('signArea-'+id);
  const card=document.getElementById('doc-'+id);
  area.innerHTML=`<div class="sign-done sign-rejected">
    <div class="sign-done-check"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    <span class="sign-done-text">반려</span>
    <span class="sign-done-time">08:${String(Math.floor(Math.random()*50+10)).padStart(2,'0')}</span>
  </div>`;
  card.classList.add('signed');
  updateSignCount(-1);
  const doc=DOCS.find(d=>d.id===id);
  ga('approval_reject',{doc_title:doc?doc.title:'',doc_type:doc?doc.type:'',amount:doc?doc.amount:0});
  closeReject();
}

function updateSignCount(delta){
  const el=document.getElementById('signCount');
  const n=Math.max(0,parseInt(el.textContent)+delta);
  el.textContent=n;
  const badge=document.getElementById('signBadge');
  if(n>0)badge.dataset.count=n;
  else badge.removeAttribute('data-count');
}

// ── Notification page ──
let notifFilter='all';
function renderNotifs(){
  const el=document.getElementById('notifList');
  const grouped={};
  const filtered=NOTIFS.filter(n=>{
    if(notifFilter==='unread')return!n.read;
    if(notifFilter==='read')return n.read;
    return true;
  });
  filtered.forEach(n=>{
    const sec=n.read?'확인완료':'미확인';
    if(!grouped[sec])grouped[sec]=[];
    grouped[sec].push(n);
  });
  let html='';
  const order=notifFilter==='read'?['확인완료']:notifFilter==='unread'?['미확인']:['미확인','확인완료'];
  order.forEach(sec=>{
    if(!grouped[sec]||!grouped[sec].length)return;
    html+=`<div class="notif-section-label">${sec}</div>`;
    grouped[sec].forEach(n=>{
      html+=`<div class="notif-item ${n.read?'read':''}" onclick="ackNotif(${n.id})" style="margin-bottom:6px">
        <div class="notif-severity notif-severity--${n.sev}"></div>
        <div class="notif-unread"></div>
        <div class="notif-body">
          <div class="notif-title">${n.title}</div>
          <div class="notif-desc">${n.desc}</div>
          <div class="notif-time">${n.time}</div>
        </div>
      </div>`;
    });
  });
  if(!filtered.length) html=`<div style="text-align:center;padding:32px 0;color:var(--ink-3);font-size:13px">${notifFilter==='unread'?'미확인 알림이 없습니다':'알림이 없습니다'}</div>`;
  el.innerHTML=html;
}

function ackNotif(id){
  const n=NOTIFS.find(x=>x.id===id);
  if(n&&!n.read){
    n.read=true;updateUnread();
    ga('notif_ack',{notif_title:n.title,severity:n.sev,category:n.cat});
  }
  renderNotifs();
}
function markAllRead(){
  const cnt=NOTIFS.filter(n=>!n.read).length;
  NOTIFS.forEach(n=>n.read=true);
  updateUnread();renderNotifs();
  ga('notif_ack_all',{count:cnt});
}
function filterNotif(f,btn){
  notifFilter=f;
  document.querySelectorAll('.notif-filter').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderNotifs();
  ga('notif_filter',{filter:f});
}
function updateUnread(){
  const c=NOTIFS.filter(n=>!n.read).length;
  document.getElementById('unreadCount').textContent=c;
  const badge=document.getElementById('notifBadge');
  if(c>0)badge.dataset.count=c;
  else badge.removeAttribute('data-count');
}

  renderRank();renderDocs();renderNotifs();redrawCharts();
